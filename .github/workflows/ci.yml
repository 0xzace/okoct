name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: okoct-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete verification
        run: pnpm verify

      - name: Run SEO regression comparison
        run: pnpm seo:compare

      - name: Upload verified static artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: okoct-dist-${{ github.sha }}
          path: |
            dist
            seo-lab/reports
            seo-lab/baselines/seo-audit.json
          if-no-files-found: error
          retention-days: 7
